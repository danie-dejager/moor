name: Continuous Delivery

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to bump the formula to, e.g. v2.19.1
        required: true

jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Bump Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@v10
        with:
          token: ${{secrets.JOHAN_GITHUB_API_TOKEN}}
          formula: moor
          tag: ${{github.event.inputs.tag || github.ref}}
